<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Surprise ❤️</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: Georgia, serif;

    background-image:
        linear-gradient(
            rgba(255,255,255,0.20),
            rgba(255,255,255,0.20)
        ),
        url("reddddd.jpg");

    background-size: cover;
    background-position: center;

    display: flex;
    justify-content: center;
    align-items: center;

    color: #6b1018;
}

.page {
    width: 90%;
    max-width: 430px;
    min-height: 650px;

    background: rgba(255,248,245,0.92);

    border: 3px solid #8b1e2d;
    border-radius: 25px;

    padding: 25px;

    text-align: center;

    box-shadow:
        0 10px 30px rgba(80,0,0,0.25);
}

.hidden {
    display: none;
}

h1 {
    font-size: 32px;
    margin-bottom: 15px;
}

h2 {
    font-size: 24px;
}

p {
    font-size: 17px;
}

.character {
    width: 100%;
    max-height: 330px;

    object-fit: contain;

    border-radius: 18px;

    margin: 15px 0;
}

button {
    border: none;

    background: #9e1b2f;
    color: white;

    padding: 13px 28px;

    border-radius: 30px;

    font-size: 17px;

    cursor: pointer;

    margin: 10px;
}

button:hover {
    background: #741323;
}

.plan {
    background: #fff;

    border: 2px solid #c65a67;

    border-radius: 18px;

    padding: 15px;

    margin: 15px 0;
}

label {
    display: block;

    font-size: 18px;
    font-weight: bold;

    margin-bottom: 8px;
}

input[type="time"] {

    padding: 10px;

    border: 2px solid #a83245;

    border-radius: 10px;

    font-size: 16px;

    width: 140px;
}

.heart {
    font-size: 25px;
    margin: 5px;
}

#result {
    font-size: 18px;
    line-height: 1.6;
}

</style>

</head>


<body>


<!-- PAGE 1 -->

<div class="page" id="page1">

    <div class="heart">
        ❤️ 🕷️ ❤️
    </div>

    <h1>
        ADVANCE HAPPY BIRTHDAY
    </h1>

    <h2>
        YOᑌIᐯI💚💋
    </h2>

    <img
        src="spider.jpg"
        class="character"
    >

    <button onclick="showPage2()">
        CONTINUE ❤️
    </button>

    <div class="heart">
        🕷️ ❤️ 🕷️
    </div>

</div>



<!-- PAGE 2 -->

<div class="page hidden" id="page2">

    <div class="heart">
        ❤️ 🕷️ ❤️
    </div>

    <h2>
        okiee birthday enkooda velaya varuvyaa🥺👉🏻👈🏻❤️
    </h2>


    <!-- MOVIE -->

    <div class="plan">

        <label>
            🎬 Movie
        </label>

        <input
            type="time"
            id="movieTime"
        >

    </div>


    <!-- TRAMPOLINE -->

    <div class="plan">

        <label>
            🤸 Trampoline
        </label>

        <input
            type="time"
            id="trampolineTime"
        >

    </div>


    <!-- BEACH -->

    <div class="plan">

        <label>
            🏖️ Beach
        </label>

        <input
            type="time"
            id="beachTime"
        >

    </div>


    <button onclick="confirmPlan()">
        DONE ❤️
    </button>

</div>



<!-- PAGE 3 -->

<div class="page hidden" id="page3">

    <div class="heart">
        ❤️ 🕷️ ❤️
    </div>

    <h1>
        YAYYY! 🎉
    </h1>

    <p>
        Your choices are saved here! 💕
    </p>

    <p id="result"></p>

    <img
        src="spider.jpg"
        class="character"
    >

    <h2>
        See you birthday gurl! ❤️🕷️
    </h2>

</div>



<script>


function showPage2() {

    document
        .getElementById("page1")
        .classList
        .add("hidden");

    document
        .getElementById("page2")
        .classList
        .remove("hidden");
}



function confirmPlan() {

    let movie =
        document.getElementById("movieTime").value;

    let trampoline =
        document.getElementById("trampolineTime").value;

    let beach =
        document.getElementById("beachTime").value;


    if (!movie || !trampoline || !beach) {

        alert(
            "Please select a time for all three plans ❤️"
        );

        return;
    }


    document
        .getElementById("page2")
        .classList
        .add("hidden");

    document
        .getElementById("page3")
        .classList
        .remove("hidden");


    document
        .getElementById("result")
        .innerHTML =

        "🎬 Movie: " + movie +

        "<br><br>" +

        "🤸 Trampoline: " + trampoline +

        "<br><br>" +

        "🏖️ Beach: " + beach;
}

</script>


</body>
</html>
